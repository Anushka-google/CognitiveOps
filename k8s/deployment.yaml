apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: your-docker-hub-username/cognitive-ops-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: cognitive-ops-config
        - secretRef:
            name: cognitive-ops-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: your-docker-hub-username/cognitive-ops-frontend:latest
        ports:
        - containerPort: 80
